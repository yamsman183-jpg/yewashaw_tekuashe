<!DOCTYPE html>
<html lang="am">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>የዋሻው ተኳሸ</title>
  <style>
    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }
    body {
      margin: 0;
      background: #0b0e14;
      color: #f4f6fb;
      font-family: sans-serif;
      overflow: hidden;
      touch-action: none;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      font-weight: bold;
      font-size: 16px;
      z-index: 10;
      text-shadow: 0 2px 4px #000;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <div id="hud">
    <div>ነጥብ: <span id="score">0</span></div>
    <div>ህይወት: <span id="hp">100</span></div>
  </div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const hpEl = document.getElementById("hp");

    let w, h;
    function resize() {
      w = canvas.width = window.innerWidth;
      h = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let score = 0;
    let hp = 100;
    let gameOver = false;
    const crosshair = { x: w / 2, y: h / 2 };
    const enemies = [];

    function spawnEnemy() {
      if (gameOver) return;
      const r = 22 + Math.random() * 14;
      enemies.push({
        x: r + Math.random() * (w - r * 2),
        y: r + 50 + Math.random() * (h - r * 2 - 120),
        r,
        life: 160,
        maxLife: 160
      });
    }

    setInterval(spawnEnemy, 1100);

    function shoot(px, py) {
      crosshair.x = px;
      crosshair.y = py;
      if (gameOver) {
        score = 0;
        hp = 100;
        gameOver = false;
        enemies.length = 0;
        scoreEl.textContent = score;
        hpEl.textContent = hp;
        return;
      }
      for (let i = enemies.length - 1; i >= 0; i--) {
        const e = enemies[i];
        const dist = Math.hypot(px - e.x, py - e.y);
        if (dist <= e.r + 12) {
          enemies.splice(i, 1);
          score += 10;
          scoreEl.textContent = score;
          return;
        }
      }
    }

    canvas.addEventListener("pointerdown", (e) => shoot(e.clientX, e.clientY));
    canvas.addEventListener("pointermove", (e) => {
      crosshair.x = e.clientX;
      crosshair.y = e.clientY;
    });

    function loop() {
      ctx.clearRect(0, 0, w, h);

      // የዋሻ ድባብ (Cave background)
      const grad = ctx.createRadialGradient(w / 2, h / 2, 40, w / 2, h / 2, Math.max(w, h) * 0.7);
      grad.addColorStop(0, "#1d2433");
      grad.addColorStop(1, "#07090d");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      if (!gameOver) {
        for (let i = enemies.length - 1; i >= 0; i--) {
          const e = enemies[i];
          e.life--;

          ctx.beginPath();
          ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
          ctx.fillStyle = "#e63946";
          ctx.fill();
          ctx.lineWidth = 3;
          ctx.strokeStyle = "#ffb703";
          ctx.stroke();

          if (e.life <= 0) {
            enemies.splice(i, 1);
            hp = Math.max(0, hp - 15);
            hpEl.textContent = hp;
            if (hp <= 0) gameOver = true;
          }
        }

        // የተኳሽ ቀስት (Crosshair)
        ctx.strokeStyle = "#00f5d4";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(crosshair.x, crosshair.y, 16, 0, Math.PI * 2);
        ctx.moveTo(crosshair.x - 24, crosshair.y);
        ctx.lineTo(crosshair.x + 24, crosshair.y);
        ctx.moveTo(crosshair.x, crosshair.y - 24);
        ctx.lineTo(crosshair.x, crosshair.y + 24);
        ctx.stroke();
      } else {
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 28px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("ጨዋታው አልቋል!", w / 2, h / 2 - 15);
        ctx.font = "18px sans-serif";
        ctx.fillText("እንደገና ለመጀመር ስክሪኑን ንካ", w / 2, h / 2 + 25);
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
